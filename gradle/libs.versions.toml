[versions]
agp = "8.9.1"
calendarview = "1.1.0"
core = "2.9.0"
data = "2.9.0"
junit = "4.13.2"
kotlin = "1.9.22"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.9.3"
constraintlayout = "2.2.0"
googleGmsGoogleServices = "4.4.2"
firebaseAuth = "23.1.0"
navigationFragment = "2.8.4"
navigationUi = "2.8.4"
view = "2.9.0"

[libraries]
calendarview = { module = "com.github.kizitonwose:CalendarView", version.ref = "calendarview" }
core = { module = "com.kizitonwose.calendar:core", version.ref = "core" }
data = { module = "com.kizitonwose.calendar:data", version.ref = "data" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigationFragment" }
navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigationUi" }
view = { module = "com.kizitonwose.calendar:view", version.ref = "view" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
googleGms = { id = "com.google.gms.google-services", version.ref = "googleGmsGoogleServices" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
